<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="loginBox" id="login-section">
        <h1>Login</h1>
        <input class="passwordInput" type="password" id="password-input" placeholder="Enter password:">
        <button class="loginBtn" id="login-button">Login</button>
    </div>
    <div id="chat-section" style="display: none;">
        <div id="chat-messages"></div>
        <input class="msgBox" type="text" id="message-input" placeholder="Type your message...">
        <button class="sendBtn" id="send-message">Send</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
